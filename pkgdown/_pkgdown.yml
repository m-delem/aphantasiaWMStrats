url: https://m-delem.github.io/aphantasiaWMStrats/
template:
  bootstrap: 5
  light-switch: yes
  bslib:
    base_font:
      google: Montserrat
    heading_font:
      google: DM Sans
# Ordered by the reading order in inst/planning/EOR-OUTLINE.md, not
# alphabetically: a reader should never meet a quantity before the page
# that defines it. Groups with no pages yet are absent rather than empty;
# the outline records what is missing.
articles:
  - title: What was measured
    navbar: What was measured
    desc: >
      The paradigm, and how a response becomes a number. Everything after
      this depends on it.
    contents:
      - articles/participants
      - articles/task-design
      - articles/scoring
      - articles/engagement
  - title: Scope
    navbar: Scope
    desc: >
      Which task versions enter the analyses, and why the rest do not.
      Every result downstream inherits this restriction.
    contents:
      - articles/version-scope
  - title: Does anything here measure anything?
    navbar: Measurement quality
    desc: >
      Reliability and validity, for the task and for the questionnaires.
      Both have to hold before an association between them means anything.
    contents:
      - articles/task-validity
      - articles/psychometrics
  - title: Confirmatory modelling
    navbar: Modelling
    desc: >
      Imagery groups fixed in advance. The strategy page says what is
      modelled and why before any results appear.
    contents:
      - articles/analysis-strategy
      - articles/composition
      - articles/performance
      - articles/joint-model
  - title: Exploratory
    navbar: Exploratory
    desc: >
      Groups not fixed in advance. Whether the questionnaires contain
      structure the vividness split misses.
    contents:
      - articles/beyond-vividness
  - title: Technical
    navbar: Technical
    desc: >
      How the models were built and checked, and what was tried and
      withdrawn along the way.
    contents:
      - articles/model-diagnostics
      - articles/implementation-notes
      - articles/lessons
  - title: Reference
    navbar: Reference
    contents:
      - articles/codebook

reference:
  - title: Data
    desc: >
      The pooled, stimulus-level CFA-WM working memory dataset (v1/v2/v3)
      and its accessor.
    contents:
      - all_data
      - get_data
  - title: Data preparation
    desc: >
      Functions used once to compute the final scores used for later analyses.
    contents:
      - compute_scores
      - score_angular
      - score_word
      - normalise_word
      - damerau_levenshtein
  - title: Compositional analysis
    desc: >
      Building the three-part relative-allocation composition and moving it
      off the simplex into ILR coordinates.
    contents:
      - compose_features
      - ilr_coords
      - engaged_ids
      - wm_thresholds
  - title: Modelling
    desc: >
      Shared Bayesian fitting defaults and posterior reporting, matching the
      `aphantasiaEmotions` package, plus the model specifications
      themselves. Formulas and priors are exported so that a script and a
      vignette use the same object: models are loaded with
      `file_refit = "never"`, and brms does not check that the formula it
      is handed matches the one the cached fit was built with.
    contents:
      - fit_brms_model
      - report_rope
      - joint_formula
      - joint_priors
      - performance_formula
      - composition_formula
      - composition_priors
      - response_priors
      - feature_family
      - squeeze_boundaries
      - lkj_marginal
  - title: Analysis helpers
    desc: >
      Quantities computed identically by the working scripts and by the
      vignettes that report them.
    contents:
      - split_half_reliability
      - spearman_brown
      - correlation_test
      - cronbach_alpha
      - mars_knots
      - composition_summary
      - centred_correlations
      - partition_variance
      - posterior_correlations
  - title: Questionnaire structure
    desc: >
      The exploratory strand: preparing the questionnaire scales for
      clustering, and checking that a clustering means what it appears to.
    contents:
      - questionnaire_scales
      - standardise_scales
      - add_imagery_composite
      - cluster_stability
      - adjusted_rand_index
  - title: Figures
    desc: >
      The plotting identity shared with `aphantasiaEmotions`, plus the
      composition-specific figures.
    contents:
      - theme_pdf
      - save_ggplot
      - scale_x_vviq
      - scale_discrete_feature
      - scale_x_aphantasia
      - scale_discrete_aphantasia
      - scale_shape_aphantasia
      - plot_composition_ternary
      - plot_composition_biplot
      - plot_split_half
      - plot_floor_group
      - plot_vviq_histogram

