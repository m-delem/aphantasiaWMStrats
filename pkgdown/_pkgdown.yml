        - text: "----"
        - text: "Measurement quality"
        - text: "Task validity"
          href: articles/task-validity.html
        - text: "Questionnaire psychometrics"
          href: articles/psychometrics.html
        - text: "----"
        - text: "Confirmatory modelling"
        - text: "The analysis: what is modelled, and why"
