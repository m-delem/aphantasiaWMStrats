url: https://m-delem.github.io/aphantasiaWMStrats/
template:
  bootstrap: 5
  light-switch: yes
  bslib:
    base_font:
      google: Montserrat
    heading_font:
      google: DM Sans
reference:
  - title: Data
    desc: >
      The pooled, stimulus-level CFA-WM working memory dataset (v1/v2/v3)
      and its accessor.
    contents:
      - all_data
      - get_data
  - title: Data preparation
    desc: >
      Functions used once to compute the final scores used for later analyses.
    contents:
      - compute_scores
      - score_angular
      - score_word
      - normalise_word
      - damerau_levenshtein
  - title: Compositional analysis
    desc: >
      Building the three-part relative-allocation composition and moving it
      off the simplex into ILR coordinates.
    contents:
      - compose_features
      - ilr_coords
      - engaged_ids
      - wm_thresholds
  - title: Modelling
    desc: >
      Shared Bayesian fitting defaults and posterior reporting, matching the
      `aphantasiaEmotions` package.
    contents:
      - fit_brms_model
      - report_rope
  - title: Figures
    desc: >
      The plotting identity shared with `aphantasiaEmotions`, plus the
      composition-specific figures.
    contents:
      - theme_pdf
      - save_ggplot
      - scale_x_vviq
      - scale_x_aphantasia
      - scale_discrete_aphantasia
      - scale_shape_aphantasia
      - plot_composition_ternary
      - plot_composition_biplot

navbar:
  left:
    - text: "Extended Online Report"
      menu:
        - text: "Paradigm characteristics"
        - text: "Task design"
          href: articles/task-design.html
        - text: "Psychometrics"
          href: articles/psychometrics.html
        - text: "Task engagement"
          href: articles/engagement.html
        - text: "Scoring"
          href: articles/scoring.html
        - text: "----"
        - text: "Technical details"
        - text: "Codebook"
          href: articles/codebook.html
    - text: "Reference"
      href: reference/index.html
